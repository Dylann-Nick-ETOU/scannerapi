services:
  postgres:
    image: postgres:16-alpine
    container_name: api-security-scanner-postgres
    environment:
      POSTGRES_DB: apisecurityscanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-security-scanner-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=apisecurityscanner;Username=postgres;Password=postgres
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-8082}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-security-scanner-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5174}:80"

volumes:
  postgres_data:
